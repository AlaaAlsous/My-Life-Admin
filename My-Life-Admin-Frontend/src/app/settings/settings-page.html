<section
  aria-labelledby="settings-heading"
  class="relative isolate overflow-hidden rounded-4xl bg-linear-to-br from-surface via-surface-muted to-blush/60 px-6 py-10 shadow-soft ring-1 ring-border-soft sm:px-12 sm:py-14"
>
  <div
    aria-hidden="true"
    class="absolute -left-16 -top-16 -z-10 h-64 w-64 rounded-full bg-rose/25 blur-3xl"
  ></div>
  <p class="text-label font-semibold uppercase tracking-widest text-rose">Settings</p>
  <h1 id="settings-heading" class="mt-2 text-4xl text-plum sm:text-5xl">
    Your <span class="text-primary">settings</span>
  </h1>
  <p class="mt-3 max-w-2xl text-lg text-text-muted">
    Choose how My Life Admin looks and how it keeps you updated.
  </p>
</section>

<section
  aria-labelledby="preferences-heading"
  class="mt-10 max-w-2xl rounded-card bg-white p-7 shadow-soft ring-1 ring-border-soft"
>
  <h2 id="preferences-heading" class="text-title text-plum">Preferences</h2>

  @if (loading()) {
    <div class="mt-4">
      <app-loading-state label="Loading settings…" [lineCount]="3" />
    </div>
  } @else if (failed()) {
    <div class="mt-4">
      <app-error-state
        message="We could not load your settings."
        retryLabel="Try again"
        (retry)="load()"
      />
    </div>
  } @else {
    @if (saveError(); as error) {
      <div class="mt-4">
        <app-error-state [message]="error" />
      </div>
    }

    <ul class="mt-4 divide-y divide-border-soft">
      <li>
        <label
          for="setting-email"
          class="flex cursor-pointer items-center justify-between gap-4 py-4"
        >
          <span>
            <span class="block font-medium text-plum">Email reminders</span>
            <span class="block text-label text-text-muted">
              Get an email when a reminder for one of your events or documents is due.
            </span>
          </span>
          <span class="relative inline-flex shrink-0">
            <input
              id="setting-email"
              type="checkbox"
              role="switch"
              class="peer sr-only"
              [checked]="emailNotifications()"
              (change)="setEmailNotifications($any($event.target).checked)"
            />
            <span
              aria-hidden="true"
              class="h-7 w-12 rounded-full bg-border transition peer-checked:bg-primary peer-focus-visible:ring-2 peer-focus-visible:ring-primary peer-focus-visible:ring-offset-2"
            ></span>
            <span
              aria-hidden="true"
              class="absolute left-1 top-1 h-5 w-5 rounded-full bg-white shadow-soft transition peer-checked:translate-x-5"
            ></span>
          </span>
        </label>
      </li>

      <li>
        <label
          for="setting-dark-mode"
          class="flex cursor-pointer items-center justify-between gap-4 py-4"
        >
          <span>
            <span class="block font-medium text-plum">Dark mode</span>
            <span class="block text-label text-text-muted">Use a darker color theme.</span>
          </span>
          <span class="relative inline-flex shrink-0">
            <input
              id="setting-dark-mode"
              type="checkbox"
              role="switch"
              class="peer sr-only"
              [checked]="darkMode()"
              (change)="setDarkMode($any($event.target).checked)"
            />
            <span
              aria-hidden="true"
              class="h-7 w-12 rounded-full bg-border transition peer-checked:bg-primary peer-focus-visible:ring-2 peer-focus-visible:ring-primary peer-focus-visible:ring-offset-2"
            ></span>
            <span
              aria-hidden="true"
              class="absolute left-1 top-1 h-5 w-5 rounded-full bg-white shadow-soft transition peer-checked:translate-x-5"
            ></span>
          </span>
        </label>
      </li>
    </ul>

    <div class="mt-6 flex flex-wrap items-center gap-3">
      <button
        type="button"
        class="rounded-full bg-primary px-6 py-2.5 font-medium text-white shadow-soft transition hover:bg-primary-hover hover:shadow-lift disabled:cursor-wait"
        [disabled]="saving()"
        [attr.aria-busy]="saving()"
        (click)="save()"
      >
        Save settings
      </button>

      <p class="text-label text-text-muted" role="status">
        @if (saved()) {
          Your settings have been saved.
        }
      </p>
    </div>
  }
</section>
