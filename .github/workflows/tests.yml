name: Tests

on:
  push:
    branches:
      - release
  pull_request:
    branches:
      - release

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore test dependencies
        run: dotnet restore My-Life-Admin-Backend.Tests/MyLife-Admin.Tests.csproj

      - name: Run tests
        run: dotnet test My-Life-Admin-Backend.Tests/MyLife-Admin.Tests.csproj --no-restore --verbosity minimal

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: My-Life-Admin-Frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: My-Life-Admin-Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watch=false
